<title>إدارة الشهادات والمراجعات — NQ</title>
<style>
:root{--p:#0F7C7A;--pd:#0A5654;--pl:#E7F3F2;--bd:#D5E2E1;--tx:#1C2B2A;--mu:#6b7c7b;--bg:#f4f7f7;--wh:#fff;
--ok:#1e8e4e;--warn:#c98a06;--bad:#c0392b;--info:#2a6fb0}
*{box-sizing:border-box}
i.fa{display:inline-flex;width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}i.fa svg{width:100%;height:100%}
.tile i.fa{width:34px;height:34px}
body{margin:0;font-family:"Microsoft Sans Serif",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
a{color:var(--p);text-decoration:none;cursor:pointer}
header{background:linear-gradient(90deg,var(--pd),var(--p));color:#fff}
.hd{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:44px;height:44px;border-radius:10px;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:bold;font-size:18px}
.logo b{font-size:15px;display:block}.logo small{opacity:.8}
.ttl{text-align:center}.ttl h1{margin:0;font-size:20px}.ttl small{opacity:.85;letter-spacing:.5px}
.usr{text-align:left;font-size:12px}.usr b{display:block}
.bc{background:var(--pd)}.bc div{max-width:1280px;margin:auto;padding:7px 16px;color:#cfe7e5;font-size:12px}
.bc a{color:#fff}
.wrap{max-width:1280px;margin:auto;display:flex;gap:16px;padding:16px}
aside{width:230px;flex:none;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px;align-self:flex-start;position:sticky;top:10px}
aside a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--tx)}
aside a i{width:18px;text-align:center;color:var(--p)}
aside a:hover,aside a.on{background:var(--pl);color:var(--pd);font-weight:bold}
aside .sec{font-size:11px;color:var(--mu);padding:10px 10px 4px;font-weight:bold}
main{flex:1;min-width:0}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 14px;color:var(--pd);font-size:17px;display:flex;align-items:center;gap:8px}
h2 small{color:var(--mu);font-weight:normal;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{background:var(--p);color:#fff;border-radius:10px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:.15s;position:relative;text-align:center;padding:8px}
.tile:hover{background:var(--pd);transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,86,84,.25)}
.tile i{font-size:32px}.tile b{font-size:14px}
.tile .cnt{position:absolute;top:8px;left:8px;background:#fff;color:var(--pd);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:bold}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;border-right:4px solid var(--p)}
.kpi span{color:var(--mu);font-size:12px}.kpi b{display:block;font-size:22px;margin-top:4px}
.flt{background:var(--pl);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:150px}
.fld label{color:var(--mu);font-size:12px}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--bd);border-radius:6px;padding:7px 9px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pl);border-color:var(--p)}
.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-family:inherit;font-weight:bold;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--pd)}.btn.l{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.sm{padding:4px 9px;font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--p);color:#fff;font-weight:bold;padding:9px 10px;text-align:right;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right}
td.c,th.c{text-align:center}
tr:hover td{background:#f7fbfb}
.bdg{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:bold;white-space:nowrap}
.b-ok{background:#e3f4ea;color:var(--ok)}.b-warn{background:#fdf3dc;color:var(--warn)}.b-bad{background:#fbe5e2;color:var(--bad)}.b-info{background:#e3eef8;color:var(--info)}.b-mu{background:#eef1f1;color:var(--mu)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--mu);font-size:12px}
.ic{border:1px solid var(--bd);background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--p)}
.ic:hover{background:var(--pl)}
/* audit file */
.af{display:flex;gap:14px}
.af nav{width:180px;flex:none}
.af nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--tx);border-right:3px solid transparent}
.af nav a.on{background:var(--pl);border-right-color:var(--p);font-weight:bold;color:var(--pd)}
.af .body{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps{display:flex;flex-wrap:wrap;gap:0;margin:10px 0 16px}
.st{flex:1;min-width:90px;text-align:center;font-size:11px;color:var(--mu);position:relative;padding-top:30px}
.st:before{content:"";position:absolute;top:11px;right:0;left:0;height:3px;background:var(--bd)}
.st .dot{position:absolute;top:2px;right:50%;transform:translateX(50%);width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--bd);z-index:1;display:grid;place-items:center;font-size:10px}
.st.done:before,.st.cur:before{background:var(--p)}
.st.done .dot{background:var(--p);border-color:var(--p);color:#fff}
.st.cur .dot{border-color:var(--p);background:var(--pl)}
.st.cur{color:var(--pd);font-weight:bold}
.mv{display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.mv .btn{font-size:14px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.cal .h{background:var(--p);color:#fff;text-align:center;padding:7px;font-weight:bold}
.cal .d{min-height:96px;border-top:1px solid var(--bd);border-left:1px solid var(--bd);padding:4px;background:#fff}
.cal .d.o{background:#f6f8f8;color:#aab}
.cal .d.t{background:var(--pl)}
.cal .n{font-size:11px;color:var(--mu)}
.ev{display:block;background:var(--p);color:#fff;border-radius:4px;padding:2px 5px;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.t2{background:#5a6fb4}.ev.t3{background:var(--warn)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px}
.bar span{width:160px;font-size:12px}
.bar div{height:18px;background:var(--p);border-radius:4px;min-width:2px}
.bar b{font-size:12px}
.modal{position:fixed;inset:0;background:rgba(10,30,30,.45);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:12px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
.modal .mh{background:var(--p);color:#fff;padding:12px 16px;font-weight:bold;display:flex;justify-content:space-between}
.modal .mb{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-start}
.toast{position:fixed;bottom:20px;left:20px;background:var(--pd);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:10}
.empty{text-align:center;color:var(--mu);padding:20px}
.hist{border-right:3px solid var(--p);padding:4px 10px;margin:6px 0;background:#fafcfc}
.hist small{color:var(--mu)}
@media(max-width:820px){.wrap{flex-direction:column}aside{width:auto;position:static;display:flex;flex-wrap:wrap}aside .sec{width:100%}.af{flex-direction:column}.af nav{width:auto;display:flex;flex-wrap:wrap}.grid2,.modal .mb{grid-template-columns:1fr}.hd{flex-wrap:wrap}.usr{text-align:right}}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pd),var(--p));padding:16px}
body.locked header,body.locked .wrap{display:none}
body.locked #login{display:flex}
.lbox{background:#fff;border-radius:14px;padding:28px;width:360px;max-width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.lbox .mk{width:56px;height:56px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:22px;margin:auto}
.lbox h1{margin:0;text-align:center;color:var(--pd);font-size:19px}.lbox small{text-align:center;color:var(--mu)}
.lbox .btn{justify-content:center;padding:10px;font-size:14px}
#l_err{color:var(--bad);font-size:12px;min-height:16px;text-align:center}
.robadge{background:#fdf3dc;color:var(--warn);border:1px solid #f0d9a0;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:bold}
.note{background:#fdf3dc;border:1px solid #f0d9a0;color:#7a5600;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.card.emg{background:#fdf0ee;border-color:#f1b9b1}
.emgbar{background:var(--bad);color:#fff;text-align:center;font-size:12px;padding:5px;font-weight:bold}
.usr a{cursor:pointer}
input:disabled,select:disabled,textarea:disabled{background:#f3f6f6;color:var(--tx)}
</style>

 if(c.order)c.arr.splice(c.arr.length-1,0,n);else c.arr.push(n);toast("تمت الإضافة");V.setlist(k)}
function setRen(k,i,n){const c=SETS[k];n=n.trim();if(!n||c.arr.includes(n))return toast(n?"الاسم موجود":"الاسم مطلوب"),V.setlist(k);const o=c.arr[i];c.arr[i]=n;c.ren(o,n);toast("تم التعديل وتحديث كل السجلات المرتبطة");V.setlist(k)}

function paintIcons(root){(root||document).querySelectorAll("i.fa:not([data-i])").forEach(e=>{const n=[...e.classList].find(c=>c.startsWith("fa-"));e.dataset.i=1;
 e.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n?.slice(3)]||'<circle cx="12" cy="12" r="3"/>'}</svg>`})}
new MutationObserver(()=>paintIcons()).observe(document.body,{childList:true,subtree:true});

/* ===================== ترقيم الشهادات (رقم عشوائي لا يتكرر) ===================== */
db.numbering={pattern:"{STD}-{RAND}",len:8,digitsOnly:true};
const usedNos=new Set(db.certificates.map(c=>c.no)); // سجل دائم بكل رقم صدر — حتى لو اتحذفت الشهادة الرقم ما يرجعش
const CTRY={"السعودية":"SA","مصر":"EG","الإمارات":"AE","الأردن":"JO","الكويت":"KW","قطر":"QA","البحرين":"BH","عمان":"OM"};
const stdPrefix=st=>st?(st.prefix||((st.code||"").match(/\d{4,5}/)||[(st.code||"X").split(/[\s.:]/)[0]])[0].toUpperCase()):"STD";
function randDigits(n,digitsOnly){const set=digitsOnly?"0123456789":"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const a=new Uint32Array(n);crypto.getRandomValues(a);
 let r=[...a].map(x=>set[x%set.length]).join("");if(digitsOnly&&r[0]=="0")r=String(1+a[0]%9)+r.slice(1);return r}
function buildNo(stdId,compId,issue,cfg){cfg=cfg||db.numbering;const y=(issue||TODAY()).slice(0,4);
 return cfg.pattern.replace(/\{STD\}/g,stdPrefix(std(stdId))).replace(/\{YYYY\}/g,y).replace(/\{YY\}/g,y.slice(2)).replace(/\{CTRY\}/g,CTRY[comp(compId).country]||"XX").replace(/\{RAND\}/g,()=>randDigits(+cfg.len||8,cfg.digitsOnly))}
function uniqueNo(stdId,compId,issue){for(let i=0;i<500;i++){const n=buildNo(stdId,compId,issue);if(!usedNos.has(n)&&!db.certificates.some(c=>c.no==n))return n}
 toast("زوّد عدد الخانات العشوائية — احتمالات التكرار عالية");return ""}
function noField(c,isNew){
 if(!isNew)return `<div class="fld"><label>رقم الشهادة</label><div style="display:flex;gap:6px"><input id="e_no" dir="ltr" value="${c.no}" readonly style="flex:1;background:var(--pl);font-weight:bold;letter-spacing:.5px;text-align:right"><span class="ic" style="display:grid;place-items:center" title="الرقم ثابت ولا يتغير بعد الإصدار"><i class="fa fa-lock"></i></span></div></div>`;
 const n=uniqueNo(c.std,c.comp,c.issue);
 return `<div class="fld"><label>رقم الشهادة * <span style="color:var(--ok)">(تلقائي — عشوائي لا يتكرر)</span></label>
 <div style="display:flex;gap:6px"><input id="e_no" dir="ltr" value="${n}" readonly data-comp="${c.comp}" style="flex:1;background:var(--pl);font-weight:bold;letter-spacing:.5px;text-align:right">
 <button type="button" class="ic" title="توليد رقم آخر" onclick="regenNo()"><i class="fa fa-rotate-left"></i></button></div>
 <label style="display:flex;gap:6px;align-items:center;margin-top:2px"><input type="checkbox" id="e_manual" onchange="const e=$('#e_no');e.readOnly=!this.checked;e.style.background=this.checked?'#fff':'var(--pl)';if(this.checked)e.select();else regenNo()"> إدخال الرقم يدويًا</label></div>`}
function regenNo(fromStd){const e=$("#e_no");if(!e||!e.dataset.comp||$("#e_manual")?.checked)return;e.value=uniqueNo(+val("e_std"),+e.dataset.comp,val("e_issue"));if(!fromStd)toast("تم توليد رقم جديد")}

 <div class="fld"><label>نوع الجزء العشوائي</label><select id="n_dig" onchange="numPrev()">${opts([{v:1,t:"أرقام فقط (مثال: 48217305)"},{v:0,t:"أرقام وحروف (مثال: K7Q2M9XA)"}],n.digitsOnly?1:0)}</select></div></div>

 ${table([{h:"#",c:1,f:r=>[...usedNos].indexOf(r)+1},{h:"رقم الشهادة",c:1,f:r=>`<b dir="ltr" style="letter-spacing:.5px;unicode-bidi:isolate">${r}</b>`},{h:"الشركة",f:r=>{const c=db.certificates.find(x=>x.no==r);return c?comp(c.comp).name:'<span style="color:var(--mu)">شهادة محذوفة — الرقم محجوز</span>'}}],[...usedNos].reverse())}</div>`;numPrev()};
function numCfg(){return {pattern:val("n_pat"),len:+val("n_len"),digitsOnly:val("n_dig")=="1"}}

async function api(method,url,body){let r;try{r=await fetch(url,{method,credentials:"same-origin",headers:{"Content-Type":"application/json","X-NQ":"1"},body:body===undefined?undefined:JSON.stringify(body)})}catch(e){syncState("off");return {ok:false,status:0,data:{error:"تعذّر الاتصال بالسيرفر — تأكد من الإنترنت"}}}

 if(r.status==401&&ME&&!url.includes("/login")){ME=null;showLogin("انتهت الجلسة — سجّل الدخول مرة أخرى")}
 if(r.status==503&&j.setup)showSetup();
 return {ok:r.ok,status:r.status,data:j}}
function syncState(s){const e=$("#sync");if(!e)return;e.textContent={ok:"● محفوظ",save:"● جارِ الحفظ…",off:"● غير متصل"}[s]||"";e.style.color={ok:"#9be7b8",save:"#ffe08a",off:"#ffb3a8"}[s]}

const stateKeys=()=>[...Object.keys(db).filter(k=>!["users","log"].includes(k)),"lists","usedNos"];
const getKey=k=>k=="lists"?LISTS:k=="usedNos"?[...usedNos]:db[k];
function setKey(k,val){if(k=="lists"){Object.entries(LISTS).forEach(([n,arr])=>{if(Array.isArray(val?.[n])&&val[n].length)arr.splice(0,arr.length,...val[n])})}
 else if(k=="usedNos"){usedNos.clear();(val||[]).forEach(x=>usedNos.add(x))}else db[k]=val}
function applyItems(items){Object.entries(items||{}).forEach(([k,o])=>{if(o.data===null||o.data===undefined)return;setKey(k,o.data);SYNC[k]={v:o.version,s:JSON.stringify(getKey(k))}})}
function pendingChanges(){const out=[];stateKeys().forEach(k=>{const val=getKey(k);if(val===undefined)return;const s=JSON.stringify(val);if(!SYNC[k]||SYNC[k].s!==s)out.push({key:k,data:val,baseVersion:SYNC[k]?.v||0,_s:s})});return out}
async function loadAll(){const r=await api("GET","/api/state");if(!r.ok)return false;const items=r.data.items||{};
 SYNC={};applyItems(items);
 if(!items.standards&&isFullAdmin(ME)){ // أول تشغيل: نبدأ بنظام نظيف (المعايير والإعدادات فقط)
  BUSINESS.forEach(k=>db[k]=[]);db.history={};db.expenses={};db.team={};usedNos.clear()}
 else stateKeys().forEach(k=>{if(!items[k]&&k!="lists"&&k!="usedNos"&&db[k]!==undefined&&!SYNC[k])db[k]=Array.isArray(db[k])?[]:(typeof db[k]=="object"?(k=="numbering"?db[k]:{}):db[k])});
 return true}
function saveSoon(){clearTimeout(_saveT);_saveT=setTimeout(pushChanges,500)}
async function pushChanges(){if(!ME)return;if(_busy){_again=true;return}const ch=pendingChanges();if(!ch.length){syncState("ok");return}
 _busy=true;syncState("save");const r=await api("POST","/api/state",{changes:ch.map(({_s,...c})=>c)});_busy=false;
 if(r.ok){ch.forEach(c=>SYNC[c.key]={v:r.data.versions[c.key],s:c._s});syncState("ok")}
 else if(r.status==409){Object.entries(r.data.conflicts||{}).forEach(([k,o])=>{if(o.data!=null)setKey(k,o.data);SYNC[k]={v:o.version,s:JSON.stringify(getKey(k))}});
  _toast0("مستخدم آخر عدّل نفس البيانات في نفس الوقت — تم تحميل آخر نسخة، راجع تعديلك");rerender(true)}
 else if(r.status==0){syncState("off");setTimeout(saveSoon,5000)}
 else if(ME){ch.forEach(c=>{if(SYNC[c.key])setKey(c.key,JSON.parse(SYNC[c.key].s))});syncState("ok");_toast0(r.data.error||"تعذّر الحفظ");rerender(true)}
 if(_again){_again=false;saveSoon()}}
